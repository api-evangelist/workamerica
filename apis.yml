description: WorkAmerica was a skilled-labor hiring marketplace that connected job seekers, employers,
  and educators to close the skills gap - "connecting education to employment, exclusively for the
  skilled labor force" (archived homepage, 2017). A 500 Global portfolio company, it appears defunct
  - the workamerica.co domain expired (registrar suspension page captured December 2018) and now
  301-redirects to an unrelated Indonesian website. No public API, developer portal, GitHub
  organization, or packages were found.
